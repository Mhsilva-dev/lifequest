name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npx oxlint
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        run: npm ci --omit=dev
      - name: Verificar sintaxe
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Subir o servidor e testar /api/health
        env:
          PORT: 3007
          SESSION_SECRET: ci
          DB_PATH: ./database/ci.db
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:3007/api/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
